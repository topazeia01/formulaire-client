<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Formulaires Séparés</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            line-height: 1.6;\n            margin: 0;\n            padding: 20px;\n        }\n        .form-container {\n            margin: 20px 0;\n            padding: 20px;\n            border: 1px solid #ccc;\n            border-radius: 5px;\n            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);\n        }\n        .form-container h2 {\n            margin-bottom: 15px;\n        }\n        .form-container label {\n            display: block;\n            margin: 10px 0 5px;\n        }\n        .form-container input, .form-container select, .form-container textarea {\n            width: 100%;\n            padding: 10px;\n            margin-bottom: 15px;\n            border: 1px solid #ccc;\n            border-radius: 4px;\n        }\n        .form-container button {\n            background-color: #4CAF50;\n            color: white;\n            padding: 10px;\n            border: none;\n            border-radius: 4px;\n            cursor: pointer;\n        }\n        .form-container button:hover {\n            background-color: #45a049;\n        }\n    </style>\n</head>\n<body>\n    <div class="form-container" id="automobile-form">\n        <h2>Formulaire Automobile</h2>\n        <label for="auto-name">Nom:</label>\n        <input type="text" id="auto-name" required>\n        <label for="auto-plate">Numéro de Plaque:</label>\n        <input type="text" id="auto-plate" required>\n        <label for="auto-email">Email:</label>\n        <input type="email" id="auto-email" required>\n        <button onclick="submitAutoForm()">Soumettre</button>\n    </div>\n    <div class="form-container" id="habitation-form">\n        <h2>Formulaire Habitation</h2>\n        <label for="hab-name">Nom:</label>\n        <input type="text" id="hab-name" required>\n        <label for="hab-address">Adresse:</label>\n        <input type="text" id="hab-address" required>\n        <label for="hab-email">Email:</label>\n        <input type="email" id="hab-email" required>\n        <button onclick="submitHabForm()">Soumettre</button>\n    </div>\n    <div class="form-container" id="amendments-form">\n        <h2>Formulaire Amendements</h2>\n        <label for="amd-name">Nom:</label>\n        <input type="text" id="amd-name" required>\n        <label for="amd-description">Description:</label>\n        <textarea id="amd-description" required></textarea>\n        <label for="amd-email">Email:</label>\n        <input type="email" id="amd-email" required>\n        <button onclick="submitAmdForm()">Soumettre</button>\n    </div>\n    <script>\n        function submitAutoForm() {\n            const name = document.getElementById('auto-name').value;\n            const plate = document.getElementById('auto-plate').value;\n            const email = document.getElementById('auto-email').value;\n            alert(`Formulaire Automobile soumis:\nNom: ${name}\nPlaque: ${plate}\nEmail: ${email}`);\n        }\n        function submitHabForm() {\n            const name = document.getElementById('hab-name').value;\n            const address = document.getElementById('hab-address').value;\n            const email = document.getElementById('hab-email').value;\n            alert(`Formulaire Habitation soumis:\nNom: ${name}\nAdresse: ${address}\nEmail: ${email}`);\n        }\n        function submitAmdForm() {\n            const name = document.getElementById('amd-name').value;\n            const description = document.getElementById('amd-description').value;\n            const email = document.getElementById('amd-email').value;\n            alert(`Formulaire Amendements soumis:\nNom: ${name}\nDescription: ${description}\nEmail: ${email}`);\n        }\n    <\/script>\n</body>\n</html>
