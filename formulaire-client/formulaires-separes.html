<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form id="professional-form" action="/submit" method="POST" enctype="multipart/form-data">
        <h2>Contact Us</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}">

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <label for="file-upload">Upload File:</label>
        <input type="file" id="file-upload" name="file-upload" accept=".pdf, .doc, .docx">

        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById('professional-form').onsubmit = function(event) {
            // Client-side validation can be done here
            if(!validateForm()) {
                event.preventDefault();
            }
        };

        function validateForm() {
            // Add validation logic
            return true;
        }
    </script>
</body>
</html>
